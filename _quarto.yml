project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"
    - "posts/**/*.qmd"
    - "nl/**/*.qmd"
    

website:
  title: "Hamed F. Ganji"
  site-url: https://hamedganji.github.io
  description: "Research, engineering, acoustics, vibration and scientific computing."
  image: assets/hamed-ganji.jpg
  image-alt: "Portrait of Hamed F. Ganji"
  open-graph: true
  navbar:
    title: "Hamed F. Ganji"
    left:
      - text: Home
        href: index.qmd
      - text: Project
        href: projects.qmd
      - text: Post
        href: posts/index.qmd
      - text: Publications
        href: publications.qmd
      - text: CV
        href: cv.qmd
      - text: Contact
        href: contact.qmd

    right:
      - text: "EN / NL"
        menu:
          - text: "English"
            href: index.qmd
          - text: "Nederlands"
            href: nl/index.qmd
      - icon: github
        href: https://github.com/HamedGanji
        aria-label: GitHub profile

  page-footer:
    left: "© 2026 Hamed F. Ganji"
    right: "Built with [Quarto](https://quarto.org) · [GitHub](https://github.com/HamedGanji)"
  search: true
  back-to-top-navigation: true

format:
  html:
    theme:
      dark: darkly
      light: cosmo
    css: assets/styles.css
    toc: true
    code-copy: true
    code-overflow: wrap
    link-external-newwindow: true
    smooth-scroll: true
    fig-align: center

execute:
  freeze: auto
